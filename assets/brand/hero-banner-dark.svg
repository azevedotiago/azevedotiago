<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 400" font-family="'Space Grotesk', system-ui, sans-serif">
  <defs>
    <linearGradient id="grad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FB8B27"></stop>
      <stop offset="35%" stop-color="#FB5C2D"></stop>
      <stop offset="65%" stop-color="#E94961"></stop>
      <stop offset="100%" stop-color="#9D3F8E"></stop>
    </linearGradient>
    <!-- Top-right orb: ellipse rx=600 ry=480 centered at (1088, 80) -->
    <radialGradient id="orbTopRight" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#FB8B27" stop-opacity="0.22"></stop>
      <stop offset="60%" stop-color="#FB8B27" stop-opacity="0"></stop>
    </radialGradient>
    <!-- Bottom-left orb: ellipse rx=700 ry=520 centered at (128, 320) -->
    <radialGradient id="orbBottomLeft" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#9D3F8E" stop-opacity="0.40"></stop>
      <stop offset="65%" stop-color="#9D3F8E" stop-opacity="0"></stop>
    </radialGradient>
    <linearGradient id="navyOverlay" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1B2545" stop-opacity="0.75"></stop>
      <stop offset="100%" stop-color="#080C1F" stop-opacity="0.92"></stop>
    </linearGradient>
  </defs>

  <!-- Base navy -->
  <rect x="0" y="0" width="1280" height="400" fill="#080C1F"></rect>

  <!-- Top-right sunset orb: 1200x960 box centered at (1088, 80) -->
  <rect x="488" y="-400" width="1200" height="960" fill="url(#orbTopRight)"></rect>

  <!-- Bottom-left magenta orb: 1400x1040 box centered at (128, 320) -->
  <rect x="-572" y="-200" width="1400" height="1040" fill="url(#orbBottomLeft)"></rect>

  <!-- Navy top->bottom overlay to deepen -->
  <rect x="0" y="0" width="1280" height="400" fill="url(#navyOverlay)"></rect>

  <!-- Eyebrow line -->
  <text x="64" y="148" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="11" font-weight="500" letter-spacing="2.2" fill="#B0A4B8">HELLO, I'M</text>

  <!-- Wordmark: 80px, Space Grotesk, letter-spacing -0.03em ≈ -2.4 -->
  <text x="64" y="234" font-size="80" font-weight="500" letter-spacing="-2.4" fill="#FFF4E8">Tiago<tspan fill="#FB5C2D">A</tspan>zevedo<tspan fill="url(#grad)">.</tspan><tspan fill="#FFF4E8" fill-opacity="0.55">pt</tspan></text>

  <!-- Role line: prompt + text + blinking caret -->
  <g font-family="'JetBrains Mono', ui-monospace, monospace" font-size="18">
    <text x="64" y="288" fill="#FB5C2D">&gt;</text>
    <text x="86" y="288" fill="#FFF4E8">Full-stack engineer · Laravel · Vue · Docker</text>
    <rect x="565" y="274" width="9" height="18" fill="#FB5C2D">
      <animate attributeName="opacity" values="1;1;0;0" dur="1s" repeatCount="indefinite"></animate>
    </rect>
  </g>

  <!-- Bottom-right meta -->
  <text x="1216" y="376" text-anchor="end" font-family="'JetBrains Mono', ui-monospace, monospace" font-size="10" letter-spacing="2" fill="#6E6378">SUNSET BUILD · v1</text>
</svg>
